  .gate[hidden]{display:none}
  .gatebox{background:var(--paper); border:2px solid var(--gold); border-radius:16px; padding:26px 22px; width:100%; max-width:360px; text-align:center}
  .gatebox img{width:200px; height:auto}
  .gatebox p{margin:10px 0 16px; color:var(--gold-dk); font:600 15px/1.6 "Noto Serif Gujarati",Montserrat,"Noto Serif Devanagari",sans-serif}

  .appbar img{width:150px; max-width:44%; height:auto; display:block}
  .langbar{display:flex; gap:6px}
  .langbar button{background:transparent; border:1px solid var(--line); color:var(--gold-dk); border-radius:999px; padding:5px 10px; cursor:pointer; font:600 13px/1.2 "Noto Serif Gujarati",Montserrat,"Noto Serif Devanagari",sans-serif}

  .time{display:inline-flex; align-items:center; gap:8px; margin:8px 0 6px; background:var(--navy); color:#fff; border-radius:999px; padding:8px 18px; font:700 clamp(16px,4.4vw,20px)/1.2 Montserrat,sans-serif}

  .hero .sub{color:var(--muted); max-width:540px; margin:6px auto 0}

  .topic h3{font-size:16.5px}

  .topic.wide p{color:#d9d2bd}

  .steps{list-style:none; margin:0; padding:0; display:grid; gap:10px}

/* IST helpers: IST = UTC + 5:30, no DST */
function istParts(ms){ const d = new Date(ms + 330*60000); return { mins:d.getUTCHours()*60 + d.getUTCMinutes(), secs:d.getUTCSeconds(), y:d.getUTCFullYear(), m:d.getUTCMonth(), day:d.getUTCDate() }; }
function istToMs(y,m,day,mins){ return Date.UTC(y,m,day,0,mins) - 330*60000; }

function nextStartMs(now){
  const p = istParts(now);
  let s = istToMs(p.y,p.m,p.day,START_MIN);
  if (now >= istToMs(p.y,p.m,p.day,END_MIN)) s += 864e5;
  return s;
}

function calLink(){
  const now = Date.now(), s = nextStartMs(now), e = s + (END_MIN-START_MIN)*60000;
  const f = ms => new Date(ms).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const t = T[L];
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(t.cal_title) +
    '&dates=' + f(s) + '/' + f(e) + '&ctz=Asia/Kolkata&recur=' + encodeURIComponent('RRULE:FREQ=DAILY') +
    '&details=' + encodeURIComponent(t.cal_desc) + '&location=' + encodeURIComponent('https://online.richwealth.in');
}

function localLine(){
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
  if (/^Asia\/(Kolkata|Calcutta)$/.test(tz) || new Date().getTimezoneOffset() === -330) return '';
  const p = istParts(Date.now());
  const s = istToMs(p.y,p.m,p.day,START_MIN), e = istToMs(p.y,p.m,p.day,END_MIN);
  const loc = { en:'en-IN', hi:'hi-IN', gu:'gu-IN' }[L];
  const fmt = ms => new Date(ms).toLocaleTimeString(loc, { hour:'numeric', minute:'2-digit' });
  return T[L].local.replace('{t}', fmt(s) + ' – ' + fmt(e) + (tz ? ' (' + tz.split('/').pop().replace(/_/g,' ') + ')' : ''));
}

function tick(){
  const t = T[L], now = Date.now(), p = istParts(now);
  const live = p.mins >= START_MIN && p.mins < END_MIN;
  const early = !live && p.mins >= START_MIN - OPEN_EARLY && p.mins < START_MIN;
  const st = $('status');
  st.classList.toggle('live', live || early);
  $('badgeTxt').textContent = live ? t.live : early ? t.soon : t.next;
  if (live) $('slabel').textContent = t.lbl_live;
  else {
    const s = nextStartMs(now), left = Math.max(0, Math.floor((s - now)/1000));
    $('slabel').textContent = p.mins < START_MIN ? t.lbl_today : t.lbl_tom;
    $('cH').textContent = pad(Math.floor(left/3600)); $('cM').textContent = pad(Math.floor(left%3600/60)); $('cS').textContent = pad(left%60);
  }
  const href = MEET_URL || wa(t.wa_join);
  $('join').href = $('dockJoin').href = href;
  $('joinTxt').textContent = MEET_URL ? t.join : t.join_wa;
  $('dockTxt').innerHTML = (live||early) ? `<span style="color:var(--live)">● ${t.dock_live}</span><small>3:00 – 5:00 PM IST</small>` : `${t.dock_next}<small>${$('slabel').textContent} ${$('cH').textContent}:${$('cM').textContent}:${$('cS').textContent}</small>`;
  $('local').textContent = localLine();
}

/* dock appears once the main Join button scrolls away */
new IntersectionObserver(([e]) => $('dock').classList.toggle('show', !e.isIntersecting)).observe($('join'));

$('share').addEventListener('click', async () => {
  const url = 'https://online.richwealth.in' + (L !== 'en' ? '/?lang=' + L : '');
  const txt = T[L].share_txt;
  if (navigator.share) { try { await navigator.share({ title:'Richwealth Online', text:txt, url }); return; } catch(e){ if (e.name === 'AbortError') return; } }
  location.href = wa(txt + ' ' + url);
});

document.addEventListener('click', e => { const b = e.target.closest('[data-lang]'); if (b) setLang(b.dataset.lang); });

const qs = new URLSearchParams(location.search).get('lang');
const saved = qs || store.get('rw_online_lang');
setLang(saved && T[saved] ? saved : 'en');
if (!saved) $('gate').hidden = false;
setInterval(tick, 1000);
</script>
</body>
</html>
